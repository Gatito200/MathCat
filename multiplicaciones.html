        <p>La multiplicación es una operación matemática que consiste en combinar dos o más cantidades para obtener un resultado llamado **producto**. Se representa con el signo **×** o **·** y permite calcular cuánto hay en conjunto cuando se repite una cantidad varias veces.</p>
