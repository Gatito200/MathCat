<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathCat - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <img src="imagenes/logo mathcat (1).png"
             alt="MathCat"
             class="logo">

        <div class="titulo-principal">
            <h1>Iniciar Sesión</h1>
            <p>Accede a tu cuenta de MathCat</p>
        </div>
    </header>

    <main class="auth-container">

        <div class="auth-card">

            <h2>Bienvenido</h2>

            <form id="loginForm">

                <input
                    type="email"
                    id="emailLogin"
                    placeholder="Correo electrónico"
                    required>

                <input
                    type="password"
                    id="passwordLogin"
                    placeholder="Contraseña"
                    required>

                <button
                    type="submit"
                    class="boton multiplicacion">
                    Iniciar Sesión
                </button>

            </form>

            <p>
                ¿No tienes una cuenta?
                <a href="registro.html">
                    Regístrate aquí
                </a>
            </p>

        </div>

    </main>

    <script src="scrpt.js"></script>

</body>

</html>
